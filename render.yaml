services:
  - type: web
    name: onelink-funding-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: onelink-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MASTER_ADMIN_EMAIL
        value: sven@onelink.solutions
      - key: MASTER_ADMIN_PASSWORD
        sync: false
      - key: SEED_TEAM_PASSWORD
        sync: false
      - key: RECOVERY_CODE
        sync: false
      - key: VALIDATION_SECRET
        generateValue: true
      - key: ZOHO_MOCK
        value: "1"
      - key: ZOHO_DC
        value: com
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ORG_ID
        sync: false
      - key: ZOHO_WORKSPACE_ID
        sync: false
      - key: ZOHO_VIEW_ID
        sync: false
      - key: ZOHO_BOOKS_ORG_ID
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_B64
        sync: false
